apiVersion: v1
kind: Service
metadata:
  name: http-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: http-server
  ports:
    - protocol: TCP
      name: http-main
      port: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: http-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: http-server
        app.kubernetes.io/version: 0.6.9
    spec:
      schedulerName: image-locality-scheduler
      tolerations:
      - key: "no-static-ip.example.org"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      topologySpreadConstraints:
      - maxSkew: 4
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: http-server
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - worker1
                - worker3
        podAffinity:
        # see: https://github.com/kubernetes/design-proposals-archive/blob/main/scheduling/podaffinity.md
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 30
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - http-server
      volumes:
        - name: shared
          emptyDir: {}
      initContainers:
        - name: generate-index
          image: nicolaka/netshoot:v0.13
          command: ["sh", "-c"]
          args:
          - echo "<html><p>Hello $(date)</p></html>" > /init/index.html
          volumeMounts:
            - name: shared
              mountPath: /init
      containers:
        - name: server-container
          image: python:3.13
          ports:
            - containerPort: 8080
          command: ["python"]
          args: ["-m", "http.server", "8080", "--directory", "/homework"]
          resources:
            requests:
              memory: "100Mi"
              cpu: "200m"
          volumeMounts:
            - name: shared
              mountPath: /homework
