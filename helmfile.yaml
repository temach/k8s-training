#
# helmfile docs: https://helmfile.readthedocs.io/en/latest/
# when uninstalling chart, must manually delete pvc/pv
#
# add repo:         helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# find charts:      helm search repo prometheus-community
# get values.yaml:  helm pull prometheus-community/prometheus


repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: open-telemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts

helmDefaults:
  # automatically create release namespaces if they do not exist
  createNamespace: true

releases:
  - name: otel-collector
    namespace: otel
    chart: open-telemetry/opentelemetry-collector
    version: "0.119.0" 
    values:
      - mode: "daemonset"
        tolerations: 
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
        image:
          # must select one of these: https://github.com/orgs/open-telemetry/packages?repo_name=opentelemetry-collector-releases
          # see collector flavours: https://github.com/open-telemetry/opentelemetry-collector-releases
          repository: "otel/opentelemetry-collector-contrib" 

        presets:
          # Configures the collector to collect logs.
          # Adds the filelog receiver to the logs pipeline
          # and adds the necessary volumes and volume mounts.
          # Best used with mode = daemonset.
          # See https://opentelemetry.io/docs/kubernetes/collector/components/#filelog-receiver for details on the receiver.
          logsCollection:
            enabled: true
            includeCollectorLogs: false
            # Enabling this writes checkpoints in /var/lib/otelcol/ host directory.
            # Note this changes collector's user to root, so that it can write to host directory.
            storeCheckpoints: false
            # The maximum bytes size of the recombined field.
            # Once the size exceeds the limit, all received entries of the source will be combined and flushed.
            maxRecombineLogSize: 102400
          # Configures the collector to collect host metrics.
          # Adds the hostmetrics receiver to the metrics pipeline
          # and adds the necessary volumes and volume mounts.
          # Best used with mode = daemonset.
          # See https://opentelemetry.io/docs/kubernetes/collector/components/#host-metrics-receiver for details on the receiver.
          hostMetrics:
            enabled: true
          # Configures the Kubernetes Processor to add Kubernetes metadata.
          # Adds the k8sattributes processor to all the pipelines
          # and adds a preset of minimum required RBAC rules to ClusterRole.
          # Best used with mode = daemonset.
          # See https://opentelemetry.io/docs/kubernetes/collector/components/#kubernetes-attributes-processor for details on the receiver.
          kubernetesAttributes:
            enabled: true

            # config:
            #   exporters:
            #     debug: {}
            #   extensions:
            #     # The health_check extension is mandatory for this chart.
            #     # Without the health_check extension the collector will fail the readiness and liveliness probes.
            #     # The health_check extension can be modified, but should never be removed.
            #     health_check:
            #       endpoint: ${env:MY_POD_IP}:13133
            #   processors:
            #     batch: {}
            #     # Default memory limiter configuration for the collector based on k8s resource limits.
            #     memory_limiter:
            #       # check_interval is the time between measurements of memory usage.
            #       check_interval: 5s
            #       # By default limit_mib is set to 80% of ".Values.resources.limits.memory"
            #       limit_percentage: 80
            #       # By default spike_limit_mib is set to 25% of ".Values.resources.limits.memory"
            #       spike_limit_percentage: 25
            #   receivers:
            #     jaeger:
            #       protocols:
            #         grpc:
            #           endpoint: ${env:MY_POD_IP}:14250
            #         thrift_http:
            #           endpoint: ${env:MY_POD_IP}:14268
            #         thrift_compact:
            #           endpoint: ${env:MY_POD_IP}:6831
            #     otlp:
            #       protocols:
            #         grpc:
            #           endpoint: ${env:MY_POD_IP}:4317
            #         http:
            #           endpoint: ${env:MY_POD_IP}:4318
            #     # if internalTelemetryViaOTLP.metrics.enabled = true, prometheus receiver will be removed
            #     prometheus:
            #       config:
            #         scrape_configs:
            #           - job_name: opentelemetry-collector
            #             scrape_interval: 10s
            #             static_configs:
            #               - targets:
            #                   - ${env:MY_POD_IP}:8888
            #     zipkin:
            #       endpoint: ${env:MY_POD_IP}:9411
            #   service:
            #     telemetry:
            #       metrics:
            #           # if internalTelemetryViaOTLP.metrics.enabled = true, this address will be removed and an otel go sdk will be configured to emit otlp
            #         address: ${env:MY_POD_IP}:8888
            #     extensions:
            #       - health_check
            #     pipelines:
            #       logs:
            #         exporters:
            #           - debug
            #         processors:
            #           - memory_limiter
            #           - batch
            #         receivers:
            #           - otlp
            #       metrics:
            #         exporters:
            #           - debug
            #         processors:
            #           - memory_limiter
            #           - batch
            #         receivers:
            #           - otlp
            #           # if internalTelemetryViaOTLP.metrics.enabled = true, prometheus receiver will be removed
            #           - prometheus
            #       traces:
            #         exporters:
            #           - debug
            #         processors:
            #           - memory_limiter
            #           - batch
            #         receivers:
            #           - otlp
            #           - jaeger
            #           - zipkin

  - name: prometheus
    namespace: prometheus
    chart: prometheus-community/prometheus
    version: "27.5.1" 
    values:
      - alertmanager:
          enabled: false

        prometheus-pushgateway:
          enabled: false

        server:
          extraFlags:
            - web.enable-lifecycle
            ## web.enable-admin-api flag controls access to the administrative HTTP API which includes functionality such as
            ## deleting time series. This is disabled by default.
            - web.enable-admin-api

          persistentVolume:
            ## If true, Prometheus server will create/use a Persistent Volume Claim
            ## If false, use emptyDir
            enabled: true

            ## Prometheus server data Persistent Volume size
            size: 8Gi

          ## Prometheus data retention period (default if not specified is 15 days)
          retention: "15d"

          ## Prometheus' data retention size. Supported units: B, KB, MB, GB, TB, PB, EB.
          retentionSize: "7GB"


