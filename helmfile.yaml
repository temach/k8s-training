#
# helmfile docs: https://helmfile.readthedocs.io/en/latest/
# when uninstalling chart, must manually delete pvc/pv
#
# add repo:         helm repo add istio https://istio-release.storage.googleapis.com/charts
# find charts:      helm search repo istio
# get values.yaml:  helm pull istio/base


repositories:
  - name: istio
    url: https://istio-release.storage.googleapis.com/charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: kiali
    url: https://kiali.org/helm-charts/

helmDefaults:
  # automatically create release namespaces if they do not exist
  createNamespace: true

releases:
  - name: istio-base
    namespace: istio-system
    chart: istio/base
    version: "1.25.0" 

  - name: istiod
    namespace: istio-system
    chart: istio/istiod
    version: "1.25.0" 

  - name: kiali-operator
    namespace: kiali
    chart: kiali/kiali-operator
    version: "2.7.0"
    # disable CRD checks, so single helmfile apply installs everything
    disableValidationOnInstall: true
    values:
      - cr:
          # For what a Kiali CR spec can look like, see: https://kiali.io/docs/configuration/kialis.kiali.io/
          create: true
          name: kiali-server
          spec:
            istio_namespace: "istio-system"
            deployment:
              service_type: "ClusterIP"
            auth:
              strategy: "anonymous"
            external_services:
              prometheus:
                # by default assumes wrong address: https://kiali.io/docs/configuration/kialis.kiali.io/#.spec.external_services.custom_dashboards.prometheus.url
                url: "http://prometheus-server.prometheus:80"

  - name: prometheus
    namespace: prometheus
    chart: prometheus-community/prometheus
    version: "27.5.1" 
    values:
      - alertmanager:
          enabled: false

        prometheus-pushgateway:
          enabled: false

        server:
          extraFlags:
            - web.enable-lifecycle
            ## web.enable-admin-api flag controls access to the administrative HTTP API which includes functionality such as
            ## deleting time series. This is disabled by default.
            - web.enable-admin-api

          persistentVolume:
            ## If true, Prometheus server will create/use a Persistent Volume Claim
            ## If false, use emptyDir
            enabled: true

            ## Prometheus server data Persistent Volume size
            size: 8Gi

          ## Prometheus data retention period (default if not specified is 15 days)
          retention: "15d"

          ## Prometheus' data retention size. Supported units: B, KB, MB, GB, TB, PB, EB.
          retentionSize: "7GB"


