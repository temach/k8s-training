apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main

  # add rewrite rules: https://kubernetes.github.io/ingress-nginx/examples/rewrite/
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /index.html
  
spec:
  ingressClassName: nginx
  rules:
    - host: homework.otus
      http:
        paths:
          # as its ImplementationSpecific, it falls under rewrite rules
          # also uses Prefix matching meaning that /homepagexxxx is VALID
          - pathType: ImplementationSpecific
            path: /homepage
            backend:
              service:
                name: http-server
                port:
                  name: mainhttp

          # nginx strict-validate-path-type rules disallow paths with . "dot" in them
          # see: https://devops.stackexchange.com/questions/19915/ingress-failing-due-to-error-path-cannot-be-used-with-pathtype-prefix
          # meaning that /index.xxxxx is VALID
          - pathType: Prefix
            path: /index
            backend:
              service:
                name: http-server
                port:
                  name: mainhttp

