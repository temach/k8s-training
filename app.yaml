apiVersion: v1
kind: Namespace
metadata:
  name: home
  labels:
    # label to activate istio
    istio-injection: enabled

---
apiVersion: v1
kind: Service
metadata:
  name: http-server
  namespace: home
spec:
  type: ClusterIP
  selector:
    app: http-server
  ports:
    - protocol: TCP
      name: mainhttp
      port: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  namespace: home
  labels:
    # set version, else kiali shows warning
    version: 0.6.9
spec:
  replicas: 4
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
    spec:
      containers:
        - name: server-container
          image: ghcr.io/aaronpowell/httpstatus:155dc50c6959df1db12cc0e07da3f2e0035a1426
          ports:
            - containerPort: 80
